<!doctype html>
<html lang="fr-CA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#13233A">
  <meta name="description" content="Nexus CTE V3 : le système d'exploitation privé de La Firme CTE, de la détection d'un signal de relève jusqu'à la clôture notariée d'une PME québécoise et de son immeuble.">
  <title>Nexus CTE · Dossier maître (V3)</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>

  <header class="mast" role="banner">
    <div class="mast-row">
      <a class="brand" href="#/" aria-label="Nexus CTE, tour de contrôle">
        <svg class="brand-mark" viewBox="0 0 26 22" aria-hidden="true" focusable="false">
          <path d="M5 3 L13 7.5 L21 11 L13 14.5 L5 19" fill="none" stroke="currentColor" stroke-width="1.1" opacity=".55"/>
          <circle cx="5" cy="3" r="2" fill="currentColor"/>
          <circle cx="13" cy="7.5" r="2" fill="currentColor"/>
          <circle cx="13" cy="14.5" r="2" fill="currentColor"/>
          <circle cx="5" cy="19" r="2" fill="currentColor"/>
          <circle cx="21" cy="11" r="2.6" class="brand-lead"/>
        </svg>
        <span class="brand-text"><strong>Nexus CTE</strong></span>
      </a>
      <div class="mast-tools">
        <button type="button" class="mast-btn" data-action="palette-open" aria-keyshortcuts="Control+K Meta+K" aria-label="Rechercher (Ctrl K)" title="Rechercher (Ctrl K)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button type="button" class="mast-btn mast-copilot" data-action="copilot-open" aria-controls="copilot" aria-label="Copilote" title="Copilote">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 4h12v9H9l-4 3v-3H4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="mast-btn mast-inbox" id="inbox-btn" data-ui="inbox-open" aria-controls="drawer" aria-label="Boîte de réception" title="Boîte de réception">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3a5 5 0 0 0-5 5v3l-1.5 3h13L15 11V8a5 5 0 0 0-5-5zM8 16a2 2 0 0 0 4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span class="inbox-badge" id="inbox-badge" hidden>0</span>
        </button>
        <button type="button" class="mast-btn mast-demo" id="demo-btn" data-ui="demo-open" aria-haspopup="true" aria-expanded="false" aria-controls="demo-menu" aria-label="Démo, données fictives : visite, labo, rôle, IA, réinitialisation" title="Démo, données fictives">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 3h4M8.5 3v5L4 16a1 1 0 0 0 .9 1.5h10.2A1 1 0 0 0 16 16l-4.5-8V3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6.2 12.5h7.6" stroke="currentColor" stroke-width="1.6"/></svg>
          <span class="mast-label">Démo</span><span class="ai-dot" id="ai-dot" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <div class="subbar">
      <nav class="tabs" aria-label="Navigation principale" id="primary-nav"></nav>
      <span class="clock" id="clock"></span>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>
  <footer class="foot"><p><span class="demo-mark">Démo · données fictives</span> Aucun appel, courriel, signature ni divulgation réels. <a href="../../index.html">← Toutes les démos</a></p></footer>

  <nav class="bottom-nav" aria-label="Navigation principale (mobile)" id="bottom-nav"></nav>

  <aside id="copilot" class="drawer" aria-labelledby="copilot-title" hidden></aside>
  <div id="drawer" class="drawer drawer-wide" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></div>
  <div id="scrim" class="scrim" hidden></div>
  <div id="modal-root"></div>
  <div id="palette" class="palette" role="dialog" aria-modal="true" aria-label="Recherche et commandes" hidden></div>
  <div id="tour" class="tour" hidden></div>
  <div id="demo-menu" class="menu-pop" role="menu" aria-label="Outils de démonstration" hidden></div>
  <div id="more-menu" class="menu-pop menu-more" role="menu" aria-label="Plus" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="print-root" aria-hidden="true"></div>

  <!-- Moniteur d’API du hub puis IA en direct facultative (copies conformes de scripts/), chargés avant l’application. -->
  <script src="vendor/api-meter.js"></script>
  <script src="vendor/anthropic-sdk.js"></script>
  <script src="vendor/live-ai.js"></script>
  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/view-tower.js"></script>
  <script src="js/view-radar.js"></script>
  <script src="js/view-dossier.js"></script>
  <script src="js/view-dossier2.js"></script>
  <script src="js/view-buyers.js"></script>
  <script src="js/view-compliance.js"></script>
  <script src="js/view-training.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/copilot.js"></script>
  <script src="js/tour.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
