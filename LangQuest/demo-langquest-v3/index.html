<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3149E0">
  <meta name="description" content="LangQuest V3: a conversation-first, speak-first language app. Listen, anticipate, speak, compare, talk with recurring characters and recall in new scenes. 30 courses, free for everyone.">
  <title>LangQuest · Speak from day one</title>
  <link rel="icon" href="assets/orbit.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/lesson.css">
  <link rel="stylesheet" href="css/studio.css">
  <link rel="stylesheet" href="css/deep.css">
  <link rel="stylesheet" href="css/simple.css">
</head>
<body>
  <a class="skip" href="#view">Skip to the app</a>
  <header class="topbar" aria-label="Demo">
    <a class="topbar__back" href="../../index.html" aria-label="All demos" title="All demos"><span aria-hidden="true">←</span><span class="topbar__backtxt">Demos</span></a>
    <span class="topbar__brand"><strong>LangQuest</strong><span class="topbar__v">V3</span></span>
    <nav class="topbar__switch" aria-label="Product surface">
      <a href="#/home" class="topbar__seg" data-surface="app">App</a>
      <a href="#/studio" class="topbar__seg" data-surface="studio">Studio</a>
    </nav>
    <span class="topbar__spacer"></span>
    <button class="topbar__icon" data-act="search-open" aria-label="Search (Ctrl or Cmd + K)" title="Search (Ctrl K)" aria-keyshortcuts="Control+K Meta+K"><span data-icon="search"></span></button>
    <span class="demomenu-wrap"><button class="topbar__demo" id="demo-btn" data-act="demo-menu" aria-haspopup="true" aria-expanded="false" aria-controls="demo-menu" title="Demo tools: tour, Test lab, API monitor, reset. Fictional data."><span data-icon="flask"></span><span>Demo</span></button><div class="demomenu" id="demo-menu" hidden></div></span>
  </header>

  <div class="stage" id="stage">
    <div class="device" id="device">
      <div class="screen" id="screen">
        <div class="statusbar" aria-hidden="true"><span id="sb-time">9:10</span><span class="statusbar__r"><span class="sb-sig"></span><span class="sb-bat"></span></span></div>
        <div class="view" id="view"></div>
        <div id="mini-host"></div>
        <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
        <div class="sheet-host" id="sheet-host"></div>
        <div id="tour-host"></div>
        <div class="toast toast--screen" id="toast" role="status" aria-live="polite"></div>
      </div>
    </div>
    <aside class="panel" id="panel" aria-label="About this screen"></aside>
  </div>
  <div id="studio-root" hidden></div>

  <div class="toast toast--global" id="toast-global" role="status" aria-live="polite"></div>
  <div class="sr-only" id="sr-live" aria-live="polite"></div>
  <div class="tour-ring" id="tour-ring" hidden aria-hidden="true"></div>
  <div id="tour-float"></div>
  <div id="search-host"></div>
  <div class="lab" id="lab" hidden><div class="lab__scrim" data-act="lab-close"></div><section class="lab__panel" role="dialog" aria-modal="true" aria-labelledby="lab-title"><div id="lab-body"></div></section></div>
  <noscript><p class="noscript">LangQuest needs JavaScript to run this interactive demo.</p></noscript>

  <script src="vendor/api-meter.js"></script>
  <script src="vendor/anthropic-sdk.js"></script>
  <script src="vendor/live-ai.js"></script>
  <script src="assets/audio/manifest.js"></script>
  <script src="js/data-catalog.js"></script>
  <script src="js/data-missions.js"></script>
  <script src="js/data-missions-extra.js"></script>
  <script src="js/data-media.js"></script>
  <script src="js/data-packs.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/art.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/match.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/capture.js"></script>
  <script src="js/views-learner.js"></script>
  <script src="js/lesson.js"></script>
  <script src="js/views-practice.js"></script>
  <script src="js/notebook.js"></script>
  <script src="js/talk.js"></script>
  <script src="js/studio.js"></script>
  <script src="js/factory.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/search.js"></script>
  <script src="js/lab.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
